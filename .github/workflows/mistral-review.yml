name: Mistral PR Review

on:
  pull_request:
    types: [ready_for_review, opened, synchronize, reopened, edited]

# Un push nuevo cancela la revisión anterior del mismo PR.
concurrency:
  group: mistral-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probar los scripts de la skill
        working-directory: skills/multilang-repo-skill/scripts
        run: python3 -B -m unittest discover -s tests

  # El revisor vive en novanoticia/mistral-review; aquí solo se llama.
  # Las traducciones también se revisan: no hay archivos excluidos.
  mistral-review:
    permissions:
      pull-requests: write
      contents: read
    uses: novanoticia/mistral-review/.github/workflows/review.yml@v1.2
    with:
      # Debe coincidir con la etiqueta de `uses:` (versión fija de mistral-review).
      ref: v1.2
      model: ${{ vars.MISTRAL_MODEL }}
    secrets:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
